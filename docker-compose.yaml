version: '3.8'

services:
  app:
    build: .
    volumes:
      - C:\Users\thisi\OneDrive\Desktop\oracle-ai-migrate-gcp-main:/app
    
    ports:
      - "3000:8080"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:CosmoAgents@1000$@db
      - VITE_SUPABASE_URL=${SUPABASE_URL}
